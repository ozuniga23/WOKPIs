<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Parts Requests</title>
<style>
  /* ============================================================
     LIGHT BOARD THEME
     - No web fonts / no CDN on purpose (reliable on old signage WebView)
     - Class-based, low specificity, no !important
     - Color is reserved for urgency; everything else stays neutral
     ============================================================ */
  :root{
    --bg:#f4f6f8;          /* page, faintly cool off-white */
    --surface:#ffffff;     /* table sheet */
    --ink:#191d23;         /* primary text */
    --ink-soft:#39414b;    /* secondary text */
    --muted:#69727d;       /* labels */
    --faint:#98a0aa;       /* quietest text / inactive */
    --line:#e7e9ed;        /* hairline */
    --line-2:#d4d9df;      /* rule / divider */
    --zebra:#f8fafb;       /* even-row tint */
    --mono:ui-monospace,"Cascadia Mono","Roboto Mono",Consolas,"SF Mono",Menlo,monospace;

    /* urgency — the only saturated colors on the board */
    --red:#bf2f1a;   --red-bg:#fbe9e5;   --red-bd:#f0c5bb;   --red-solid:#cf3a22;
    --amber:#9c5a08; --amber-bg:#fbf0dc; --amber-bd:#ecd3a6;
    --green:#1d7a4a; --green-bg:#e7f3ec; --green-bd:#bfdcc9;

    /* neutral — for everything that isn't urgent */
    --neutral-bg:#eef0f3; --neutral-bd:#dde0e5; --neutral-tx:#586571;

    /* priority scale — a warm→cool ramp, deliberately NOT the alarm red */
    --pr-highest:#c2540c; --pr-highest-bg:#fcebde; --pr-highest-bd:#f2cda6;
    --pr-high:#94720f;    --pr-high-bg:#f8f1d6;    --pr-high-bd:#e8d39c;
    --pr-med:#586571;     --pr-med-bg:#eef0f3;     --pr-med-bd:#dde0e5;
    --pr-low:#356a9e;     --pr-low-bg:#e8f0f9;     --pr-low-bd:#c4d7ec;
    --pr-lowest:#74808f;  --pr-lowest-bg:#eef1f5;  --pr-lowest-bd:#d9dfe6;
  }

  html{font-size:18px;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .wrap{height:100%;display:flex;flex-direction:column;padding:26px 30px 18px;}

  /* ---- Header ---- */
  .head{display:flex;align-items:center;justify-content:space-between;
    border-bottom:2px solid var(--line-2);padding-bottom:18px;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:18px;}
  .mark{width:6px;height:46px;background:var(--ink);border-radius:3px;}
  .title{font-size:2.15rem;font-weight:700;letter-spacing:0.03em;line-height:1;margin:0;text-transform:uppercase;}
  .subtitle{font-size:0.78rem;letter-spacing:0.28em;color:var(--muted);text-transform:uppercase;margin-top:8px;}

  .meta{display:flex;align-items:center;gap:26px;}
  .count-block{display:flex;flex-direction:column;align-items:flex-end;line-height:1;}
  .count{font-size:2.5rem;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .count-label{font-size:0.72rem;letter-spacing:0.26em;color:var(--muted);text-transform:uppercase;margin-top:7px;}
  .vrule{width:1px;height:46px;background:var(--line-2);}
  .feed{display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
  .clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.2rem;color:var(--ink-soft);letter-spacing:0.02em;}
  .stamp{display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--muted);}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:0 0 auto;}
  .dot.stale{background:#d39a2a;}
  .dot.down{background:var(--red-solid);}

  /* ---- Board ---- */
  .board{flex:1;min-height:0;overflow:hidden;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  thead th{
    text-align:left;font-size:0.9rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--muted);font-weight:600;padding:16px 18px;border-bottom:2px solid var(--line-2);
    background:var(--surface);
  }
  tbody td{
    padding:13px 16px;border-bottom:1px solid var(--line);font-size:1.4rem;vertical-align:middle;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);
  }
  tbody tr:nth-child(even){background:var(--zebra);}
  tbody tr:last-child td{border-bottom:none;}

  /* overdue row: clean full-row flag (soft red wash + solid left edge) */
  tbody tr.row-late{background:var(--red-bg);}
  tbody tr.row-late td:first-child{box-shadow:inset 4px 0 0 0 var(--red-solid);}

  /* column widths */
  .c-wo{width:11%;}
  .c-parts{width:33%;}
  .c-parts .parts{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;}
  .c-prio{width:13%;}
  .c-tech{width:15%;}
  .c-wait{width:11%;}
  .c-status{width:9%;}
  .c-eta{width:8%;}

  .wo{font-family:var(--mono);font-weight:600;color:var(--ink);letter-spacing:0.01em;font-size:1.35rem;}
  .tech{color:var(--ink-soft);}
  .eta{color:var(--muted);font-variant-numeric:tabular-nums;font-size:1.3rem;}

  /* ---- Pills ---- */
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:7px;
    font-size:1rem;font-weight:600;letter-spacing:0.01em;border:1px solid transparent;
    line-height:1.15;white-space:nowrap;}

  /* priority: a 5-step warm→cool scale, kept distinct from the alarm reds */
  .p-crit   {color:var(--red);        background:var(--red-bg);        border-color:var(--red-bd);font-weight:700;}
  .p-highest{color:var(--pr-highest); background:var(--pr-highest-bg); border-color:var(--pr-highest-bd);font-weight:700;}
  .p-high   {color:var(--pr-high);    background:var(--pr-high-bg);    border-color:var(--pr-high-bd);font-weight:700;}
  .p-med    {color:var(--pr-med);     background:var(--pr-med-bg);     border-color:var(--pr-med-bd);}
  .p-low    {color:var(--pr-low);     background:var(--pr-low-bg);     border-color:var(--pr-low-bd);}
  .p-lowest {color:var(--pr-lowest);  background:var(--pr-lowest-bg);  border-color:var(--pr-lowest-bd);}
  .p-defer  {color:var(--faint);      background:var(--neutral-bg);    border-color:var(--neutral-bd);}
  .p-none   {color:var(--faint);      background:transparent;          border-color:var(--line);}

  /* waiting: the heartbeat. LATE is the one loud, solid signal */
  .w-late  {color:#fff;        background:var(--red-solid);border-color:var(--red-solid);font-weight:700;}
  .w-due   {color:var(--amber);background:var(--amber-bg);  border-color:var(--amber-bd);font-weight:700;}
  .w-ok    {color:var(--ink-soft);background:transparent;   border-color:transparent;}
  .w-none  {color:var(--faint);background:transparent;      border-color:var(--line);}

  /* status: quiet workflow state, differentiated by a small dot */
  .s-new::before,.s-ordered::before,.s-delivered::before,.s-cancelled::before{
    content:"";width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .s-new       {color:var(--neutral-tx);background:var(--neutral-bg);border-color:var(--neutral-bd);}
  .s-new::before{background:#6b7785;}
  .s-ordered   {color:var(--neutral-tx);background:var(--neutral-bg);border-color:var(--neutral-bd);}
  .s-ordered::before{background:#c08a2e;}
  .s-delivered {color:var(--green);background:var(--green-bg);border-color:var(--green-bd);}
  .s-delivered::before{background:var(--green);}
  .s-cancelled {color:var(--faint);background:var(--neutral-bg);border-color:var(--neutral-bd);text-decoration:line-through;}
  .s-cancelled::before{background:#b8bec6;}
  .s-none      {color:var(--faint);background:transparent;border-color:var(--line);}

  /* ---- States ---- */
  .center{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:14px;text-align:center;padding:40px;}
  .center .big{font-size:1.9rem;font-weight:700;color:var(--ink-soft);letter-spacing:0.01em;}
  .center .sub{font-size:1.05rem;color:var(--muted);max-width:680px;line-height:1.55;}
  .center .sub code{background:var(--neutral-bg);padding:3px 9px;border-radius:5px;color:var(--ink);
    font-family:var(--mono);border:1px solid var(--neutral-bd);font-size:0.95rem;}

  /* ---- Footer ---- */
  .foot{display:flex;justify-content:space-between;align-items:center;color:var(--faint);
    font-size:0.74rem;letter-spacing:0.12em;text-transform:uppercase;padding-top:14px;}
  .pager{display:flex;gap:8px;align-items:center;}
  .pg{width:8px;height:8px;border-radius:50%;background:var(--line-2);}
  .pg.on{background:var(--ink);}

  /* ---- Refresh progress: builds up over one 60s refresh cycle ---- */
  .progress{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:12px;}
  .progress-fill{height:100%;background:var(--ink-soft);border-radius:999px;
    transform:scaleX(0);transform-origin:left center;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <div class="title">Parts Requests</div>
          <div class="subtitle">Maintenance &middot; Live Board</div>
        </div>
      </div>
      <div class="meta">
        <div class="count-block">
          <span class="count" id="count">0</span>
          <span class="count-label">Active</span>
        </div>
        <div class="vrule"></div>
        <div class="feed">
          <span class="clock" id="clock">--:--</span>
          <span class="stamp"><span class="dot" id="dot"></span><span id="stamp">Loading&hellip;</span></span>
        </div>
      </div>
    </div>

    <div class="board" id="board"></div>

    <div class="foot">
      <div id="footnote">Source: Fiix &rarr; Tracker &middot; Auto-refresh</div>
      <div class="pager" id="pager"></div>
    </div>

    <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

<script>
/* =====================================================================
   CONFIG  --  edit these
   ===================================================================== */

/* 1) The published-CSV URL of your TV tab.
      Sheet -> Share -> Publish to web -> pick the "TV" sheet -> CSV -> copy link.
      It looks like:
      https://docs.google.com/spreadsheets/d/e/2PACX-xxxxxxxx/pub?gid=123456&single=true&output=csv

      FALLBACK if your player ever blocks the fetch (CORS): turn on link sharing
      ("Anyone with the link: Viewer") and use the gviz endpoint instead, which has
      rock-solid CORS and reads slightly fresher than publish-to-web:
      https://docs.google.com/spreadsheets/d/SHEET_ID/gviz/tq?tqx=out:csv&gid=TV_TAB_GID
*/
var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgOws5gWITuUP220CD79ZYAWnj7Rzl52Z0w_LT4RiR573TfOeHqt44Sf3AwdkE3y26c1FFPn_Em2vZ/pub?gid=603035265&single=true&output=csv";

var REFRESH_SECONDS    = 60;   /* how often to re-pull the sheet            */
var ROWS_PER_PAGE      = 11;   /* rows shown at once; extra rows auto-cycle. set huge (999) to disable paging */
var PAGE_SECONDS       = 14;   /* seconds each page is shown when cycling    */
var HARD_RELOAD_MINUTES= 0;    /* 0 = off. Set e.g. 360 for a full reload every 6h (memory hygiene on old players) */

/* Column order in the TV tab (0-based). Change only if you reorder the tab. */
var COL = { WO:0, PARTS:1, PRIORITY:2, TECH:3, WAITING:4, STATUS:5, ETA:6 };

/* =====================================================================
   STATE
   ===================================================================== */
var lastRows = [];
var currentPage = 0;
var lastOk = 0;          /* timestamp of last successful fetch */
var fetchFailed = false;
var configMissing = (CSV_URL.indexOf("PASTE_") === 0 || CSV_URL === "");

/* =====================================================================
   CSV PARSER  (handles quotes, embedded commas/newlines, "" escapes)
   ===================================================================== */
function parseCSV(text){
  var rows=[], row=[], field="", inQ=false, i, c, n;
  for(i=0;i<text.length;i++){
    c=text.charAt(i);
    if(inQ){
      if(c==='"'){
        if(text.charAt(i+1)==='"'){ field+='"'; i++; }
        else { inQ=false; }
      } else { field+=c; }
    } else {
      if(c==='"'){ inQ=true; }
      else if(c===','){ row.push(field); field=""; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c==='\r'){
        n=text.charAt(i+1);
        if(n!=='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      }
      else { field+=c; }
    }
  }
  row.push(field);
  if(!(row.length===1 && row[0]==="" && rows.length>0)){ rows.push(row); }
  return rows;
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function esc(s){
  s = (s===null||s===undefined) ? "" : String(s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function cell(row,idx){ return (row && row[idx]!==undefined && row[idx]!==null) ? String(row[idx]).trim() : ""; }

function priorityClass(v){
  var s=String(v||"").toLowerCase();
  /* true emergencies keep the alarm red; the 5 normal tiers use the warm→cool scale */
  if(s.indexOf("crit")>=0||s.indexOf("emerg")>=0||s.indexOf("urgent")>=0) return "p-crit";
  if(s.indexOf("highest")>=0||s==="1") return "p-highest";
  if(s.indexOf("high")>=0||s==="2") return "p-high";
  if(s.indexOf("med")>=0||s.indexOf("norm")>=0||s==="3") return "p-med";
  if(s.indexOf("lowest")>=0||s==="5") return "p-lowest";
  if(s.indexOf("low")>=0||s==="4") return "p-low";
  if(s.indexOf("defer")>=0||s.indexOf("plan")>=0) return "p-defer";
  return "p-none";
}
function waitingDays(v){
  var m=String(v||"").match(/(\d+)/);
  return m ? parseInt(m[1],10) : null;
}
function waitingClass(v, status){
  /* the waiting clock only flags NEW requests (still waiting for someone to order the
     part). once it's ordered or delivered it's being handled -> never red/amber. */
  var d=waitingDays(v);
  if(d===null) return "w-none";   /* no day count -> nothing to show */
  if(String(status||"").trim().toLowerCase()!=="new") return "w-ok"; /* handled -> plain */
  if(d>=4) return "w-late";       /* New 4+ days  -> red + whole-row highlight */
  if(d>=2) return "w-due";        /* New 2-3 days -> amber */
  return "w-ok";                  /* New 0-1 days -> plain, no color */
}
function waitingLabel(v){
  /* show just the day count, no OK / DUE / LATE words */
  var s=String(v||"").trim();
  if(s==="") return "";
  var d=waitingDays(s);
  if(d!==null) return d+"d";
  return esc(s.replace(/\b(late|due|ok)\b/gi,"").trim());
}
function statusClass(v){
  var s=String(v||"").trim().toLowerCase();
  if(s==="new") return "s-new";
  if(s==="ordered") return "s-ordered";
  if(s==="delivered") return "s-delivered";
  if(s==="cancelled"||s==="canceled") return "s-cancelled";
  return "s-none";
}
function pad(n){ return n<10 ? "0"+n : ""+n; }

/* =====================================================================
   RENDER
   ===================================================================== */
function renderSetup(){
  document.getElementById("board").innerHTML =
    '<div class="center">'
    + '<div class="big">Set the data source</div>'
    + '<div class="sub">Open this file and set <code>CSV_URL</code> to your TV tab&rsquo;s '
    + 'published-CSV link (Sheet &rarr; Share &rarr; Publish to web &rarr; CSV).</div>'
    + '</div>';
  document.getElementById("count").textContent = "0";
}

function renderEmpty(){
  document.getElementById("board").innerHTML =
    '<div class="center"><div class="big">No active parts requests</div>'
    + '<div class="sub">Open requests will appear here automatically.</div></div>';
}

function renderPage(){
  var board=document.getElementById("board");
  var total=lastRows.length;

  if(total===0){ renderEmpty(); renderPager(0,0); return; }

  var pages = Math.ceil(total / ROWS_PER_PAGE);
  if(currentPage >= pages){ currentPage = 0; }
  var start = currentPage * ROWS_PER_PAGE;
  var slice = lastRows.slice(start, start + ROWS_PER_PAGE);

  var html =
    '<table><thead><tr>'
    + '<th class="c-wo">WO #</th>'
    + '<th class="c-parts">Parts Needed</th>'
    + '<th class="c-prio">Priority</th>'
    + '<th class="c-tech">Technician</th>'
    + '<th class="c-wait">Waiting</th>'
    + '<th class="c-status">Status</th>'
    + '<th class="c-eta">ETA</th>'
    + '</tr></thead><tbody>';

  var i, r, prio, wait, stat, waitLbl, wcls;
  for(i=0;i<slice.length;i++){
    r=slice[i];
    prio=cell(r,COL.PRIORITY);
    wait=cell(r,COL.WAITING);
    stat=cell(r,COL.STATUS);
    waitLbl=waitingLabel(wait);
    wcls=waitingClass(wait, stat);
    html +=
      '<tr'+(wcls==="w-late"?' class="row-late"':'')+'>'
      + '<td class="c-wo"><span class="wo">'+esc(cell(r,COL.WO))+'</span></td>'
      + '<td class="c-parts"><span class="parts">'+esc(cell(r,COL.PARTS))+'</span></td>'
      + '<td class="c-prio">'+(prio?'<span class="pill '+priorityClass(prio)+'">'+esc(prio)+'</span>':'')+'</td>'
      + '<td class="c-tech tech">'+esc(cell(r,COL.TECH))+'</td>'
      + '<td class="c-wait">'+(waitLbl?'<span class="pill '+wcls+'">'+waitLbl+'</span>':'')+'</td>'
      + '<td class="c-status">'+(stat?'<span class="pill '+statusClass(stat)+'">'+esc(stat)+'</span>':'')+'</td>'
      + '<td class="c-eta eta">'+esc(cell(r,COL.ETA))+'</td>'
      + '</tr>';
  }
  html += '</tbody></table>';
  board.innerHTML = html;

  document.getElementById("count").textContent = total;
  renderPager(pages, currentPage);
}

function renderPager(pages, active){
  var p=document.getElementById("pager");
  if(pages<=1){ p.innerHTML=""; return; }
  var html="", i;
  for(i=0;i<pages;i++){ html += '<span class="pg'+(i===active?' on':'')+'"></span>'; }
  p.innerHTML=html;
}

/* =====================================================================
   DATA
   ===================================================================== */
function applyData(rows){
  /* keep only real data rows: WO present and not a spreadsheet error (#N/A etc.) */
  var clean=[], i, r, wo;
  for(i=1;i<rows.length;i++){          /* skip header row 0 */
    r=rows[i];
    wo=cell(r,COL.WO);
    if(wo!=="" && wo.charAt(0)!=="#"){ clean.push(r); }
  }
  lastRows=clean;
  renderPage();
}

function fetchData(){
  if(configMissing){ return; }
  var sep = (CSV_URL.indexOf("?")>=0) ? "&" : "?";
  var url = CSV_URL + sep + "_cb=" + (new Date()).getTime();   /* bust browser/proxy cache */
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function(){
    if(xhr.readyState!==4){ return; }
    if(xhr.status>=200 && xhr.status<300 && xhr.responseText){
      try{
        applyData(parseCSV(xhr.responseText));
        lastOk = (new Date()).getTime();
        fetchFailed = false;
      }catch(e){ fetchFailed = true; }
    } else {
      fetchFailed = true;   /* keep last-good data on screen, just flag it */
    }
    updateStamp();
  };
  xhr.onerror = function(){ fetchFailed=true; updateStamp(); };
  try{ xhr.send(); }catch(e){ fetchFailed=true; updateStamp(); }
}

/* =====================================================================
   CLOCK + STATUS
   ===================================================================== */
function updateClock(){
  var d=new Date();
  document.getElementById("clock").textContent = pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  updateStamp();
}
function updateStamp(){
  var dot=document.getElementById("dot");
  var stamp=document.getElementById("stamp");
  if(configMissing){ dot.className="dot down"; stamp.textContent="No data source set"; return; }
  if(lastOk===0 && fetchFailed){ dot.className="dot down"; stamp.textContent="Cannot reach sheet"; return; }
  if(lastOk===0){ dot.className="dot"; stamp.textContent="Loading\u2026"; return; }

  var ageMs=(new Date()).getTime()-lastOk;
  var t=new Date(lastOk);
  var label="Updated "+pad(t.getHours())+":"+pad(t.getMinutes())+":"+pad(t.getSeconds());

  if(fetchFailed || ageMs > REFRESH_SECONDS*1000*2.5){
    dot.className="dot stale";
    stamp.textContent=label+" (stale)";
  } else {
    dot.className="dot";
    stamp.textContent=label;
  }
}

/* =====================================================================
   INIT
   ===================================================================== */
function startProgress(){
  /* reset the bar to empty, then build it up to full over one refresh cycle.
     a single CSS transition does the animating -> no per-frame JS on the player. */
  var f=document.getElementById("progress-fill");
  if(!f){ return; }
  f.style.transition="none";
  f.style.transform="scaleX(0)";
  void f.offsetWidth;                /* force reflow so the reset takes effect */
  f.style.transition="transform "+REFRESH_SECONDS+"s linear";
  f.style.transform="scaleX(1)";
}

function init(){
  if(configMissing){ renderSetup(); updateClock(); setInterval(updateClock,1000); return; }

  updateClock();
  fetchData();
  startProgress();

  setInterval(updateClock, 1000);
  setInterval(function(){ fetchData(); startProgress(); }, REFRESH_SECONDS*1000);

  /* page cycling for overflow */
  setInterval(function(){
    if(lastRows.length > ROWS_PER_PAGE){
      var pages=Math.ceil(lastRows.length/ROWS_PER_PAGE);
      currentPage=(currentPage+1)%pages;
      renderPage();
    }
  }, PAGE_SECONDS*1000);

  if(HARD_RELOAD_MINUTES>0){
    setTimeout(function(){ window.location.reload(); }, HARD_RELOAD_MINUTES*60*1000);
  }
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", init, false);
} else { init(); }
</script>
</body>
</html>
