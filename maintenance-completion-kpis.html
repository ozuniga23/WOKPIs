<script>
/* Optional one-time reveal. ES5 syntax and SVG 1.1 attributes for older TVs.
   All values remain in the HTML as a static fallback if JavaScript is off. */
(function () {
  if (!document.querySelectorAll) { return; }
  var paths = document.querySelectorAll('path');
  var marks = document.querySelectorAll('[data-reveal-month]');
  var originals = [], coordinates = [], months = [];
  var duration = 3000, started, stopped = false;
  var i, j;

  function finish() {
    stopped = true;
    for (i = 0; i < originals.length; i += 1) {
      paths[i].setAttribute('d', originals[i]);
    }
    for (i = 0; i < marks.length; i += 1) {
      marks[i].removeAttribute('opacity');
    }
  }

  function frame() {
    if (stopped) { return; }
    try {
      var elapsed = Math.max(0, new Date().getTime() - started);
      if (elapsed >= duration) { finish(); return; }
      var progress = elapsed / duration;
      var edge = 160 + 1280 * progress;
      for (i = 0; i < paths.length; i += 1) {
        var numbers = coordinates[i], drawing = '';
        for (j = 0; j < numbers.length; j += 4) {
          var ax = numbers[j], ay = numbers[j + 1];
          var bx = numbers[j + 2], by = numbers[j + 3];
          if (edge <= ax) { continue; }
          var endX = Math.min(edge, bx);
          var endY = ay + (by - ay) * (endX - ax) / (bx - ax);
          drawing += 'M' + ax + ',' + ay + 'L' + endX.toFixed(1) + ',' + endY.toFixed(1) + ' ';
        }
        paths[i].setAttribute('d', drawing);
      }
      for (i = 0; i < marks.length; i += 1) {
        var opacity = Math.min(1, Math.max(0, (progress * 7 - months[i]) * 3 + 1));
        marks[i].setAttribute('opacity', opacity);
      }
      setTimeout(frame, Math.min(33, duration - elapsed));
    } catch (error) {
      finish();
    }
  }

  try {
    for (i = 0; i < paths.length; i += 1) {
      var original = paths[i].getAttribute('d');
      originals.push(original);
      var matches = original.match(/-?\d+(?:\.\d+)?/g);
      var values = [];
      for (j = 0; j < matches.length; j += 1) { values.push(Number(matches[j])); }
      coordinates.push(values);
    }
    for (i = 0; i < marks.length; i += 1) {
      months.push(Number(marks[i].getAttribute('data-reveal-month')));
    }
    started = new Date().getTime();
    frame();
  } catch (error) {
    finish();
  }
}());
</script>
