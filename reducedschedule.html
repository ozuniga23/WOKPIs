  .glow { position:absolute; border-radius:50%; }

  .glow2 { bottom:-360px; right:-180px; width:1040px; height:1040px;

  @keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.035); } }

  @keyframes ring { 0% { transform:scale(1); opacity:0.55; } 100% { transform:scale(1.22); opacity:0; } }
  @-webkit-keyframes drift1 { from { -webkit-transform:translate(0,0); } to { -webkit-transform:translate(50px,36px); } }
