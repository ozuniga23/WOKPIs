<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Orders Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#f4f3ef; color:#1a1816;
    font-family:'Archivo', Arial, Helvetica, sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  * { box-sizing:border-box; }
  #stage { position:relative; width:100vw; height:100vh; min-width:320px; min-height:240px; background:#f4f3ef; }
  .screen { position:absolute; left:0; top:0; width:100%; height:100%; background:#f4f3ef; opacity:0; will-change:opacity; }
  .header { position:absolute; left:0; top:2.4vh; width:100%; text-align:center; }
  .title { margin:0; padding:0; font-size:5.45vw; line-height:0.95; font-weight:900; letter-spacing:-0.045em; color:#1a1816; }
  .subtitle { margin-top:1.0vh; font-size:2.05vw; line-height:1; font-weight:800; letter-spacing:-0.025em; color:#8a877f; }
  .plot { position:absolute; left:3.3vw; right:4.3vw; top:19.4vh; bottom:8.6vh; }
  .rows { position:absolute; left:0; top:0; right:0; bottom:4.8vh; overflow:hidden; display:flex; flex-direction:column; }
  .row { position:relative; flex:1 1 0; }
  .name { position:absolute; left:0; top:50%; width:12.7vw; margin-top:-1.05vw; text-align:right;
    font-size:1.95vw; line-height:2.1vw; font-weight:900; letter-spacing:-0.035em; color:#26231f; text-transform:uppercase; white-space:nowrap; }
  .bar-area { position:absolute; left:15vw; right:3.8vw; top:50%; height:3.35vh; margin-top:-1.675vh; }
  .bar { position:absolute; left:0; top:0; height:100%; width:0%;
    border-radius:0 999px 999px 0;
    box-shadow:0 2px 5px rgba(20,16,10,0.13), inset 0 0 0 1px rgba(0,0,0,0.05); }
  .value { position:absolute; left:0; top:50%; margin-top:-1.32vw; margin-left:0.8vw;
    font-size:2.45vw; line-height:2.65vw; font-weight:900; letter-spacing:-0.045em; color:#1a1816;
    white-space:nowrap; opacity:0; transform:scale(0.7); transform-origin:left center; will-change:transform, opacity; }
  .axis { position:absolute; left:15vw; right:0; bottom:0; height:3.8vh; border-top:2px solid #d6d3cb;
    display:flex; justify-content:space-between; align-items:flex-start; }
  .tick { width:0; display:flex; flex-direction:column; align-items:center; }
  .tick-mark { width:2px; height:1.2vh; margin-top:-0.6vh; background:#c2bfb6; }
  .tick-label { margin-top:0.5vh; font-size:1.72vw; line-height:1.72vw; font-weight:900; letter-spacing:-0.04em; color:#56544e; white-space:nowrap; }
  .last-updated { position:absolute; right:1.7vw; bottom:1.9vh; font-size:1.0vw; line-height:1.1vw; font-weight:700; letter-spacing:0.01em; color:#a8a69f; }
  .progress { position:absolute; left:0; bottom:0; width:100%; height:0.8vh; min-height:6px; background:#e6e4dd; z-index:5; }
  .progress-fill { position:absolute; left:0; top:0; height:100%; width:0%; background:#22201d; }
</style>
</head>
<body>
<div id="stage">
  <div class="screen" id="screen0"></div>
  <div class="screen" id="screen1"></div>
  <div class="progress"><div class="progress-fill" id="pfill"></div></div>
</div>

<script>
(function () {
  // ---------- Timing: 40s total = 20s per slide (8s build + 12s hold) ----------
  var SLIDE = 20000;            // ms per slide
  var TOTAL = SLIDE * 2;        // two slides
  var BUILD = SLIDE * 0.4;      // build-up window per slide (8s of 20s)
  var FADE  = 600;             // crossfade duration

  // ---------- Live data source ----------
  // Read-only Apps Script endpoint backed by the private Google Sheet.
  var DATA_URL = 'https://script.google.com/macros/s/AKfycbzTZBXdepYHcVDlWMlHRHX1Lx6hM_HCFMPLh4nqgL-qA-PU6b-AVdUCfWGv36VXnW6P/exec';

  // Fallback shown ONLY if the JSON can't be reached (last known values).
  var FALLBACK = {
    asOf: '6/25/26',
    active: [
      {name:'Gabriel',value:22},{name:'Daniel',value:22},{name:'Woody',value:18},
      {name:'Zeke',value:16},{name:'Jesus',value:15},{name:'Noe T',value:15},
      {name:'Noe M',value:14},{name:'Manuel',value:10},{name:'Kyle',value:9},
      {name:'Martin',value:7},{name:'Leo',value:7},{name:'Link',value:5}
    ],
    completedMTD: [
      {name:'Leo',value:80},{name:'Noe M',value:75},{name:'Jesus',value:68},
      {name:'Daniel',value:58},{name:'Gabriel',value:55},{name:'Kyle',value:49},
      {name:'Martin',value:49},{name:'Woody',value:47},{name:'Noe',value:35},
      {name:'Zeke',value:27},{name:'Manuel',value:16},{name:'Link',value:13}
    ]
  };

  function el(tag, cls){ var e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function sortDesc(items){ return items.slice().sort(function(a,b){ return b.value - a.value; }); }
  function niceAxisMax(m){ if(m<10)return 10; if(m<30)return Math.floor(m/5)*5+5; if(m<100)return Math.floor(m/10)*10+10; return Math.floor(m/20)*20+20; }
  function axisTicks(am){ var step=am<=30?5:(am<=100?10:20),t=[],i; for(i=0;i<=am;i+=step)t.push(i); if(t[t.length-1]!==am)t.push(am); return t; }
  function lerp(a,b,t){ return a + (b-a)*t; }

  // Convert OKLCH -> sRGB rgb() string. Older browsers (e.g. OptiSigns players)
  // don't support the oklch() CSS color function, so we precompute rgb() instead.
  function oklchToRgb(L, C, H){
    var hr = H * Math.PI / 180;
    var a = C * Math.cos(hr), b = C * Math.sin(hr);
    var l_ = L + 0.3963377774 * a + 0.2158037573 * b;
    var m_ = L - 0.1055613458 * a - 0.0638541728 * b;
    var s_ = L - 0.0894841775 * a - 1.2914855480 * b;
    var l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
    var r = +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
    var g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
    var bl = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
    function gamma(x){ x = x <= 0.0031308 ? 12.92*x : 1.055*Math.pow(x, 1/2.4) - 0.055; return Math.max(0, Math.min(1, x)); }
    return 'rgb(' + Math.round(gamma(r)*255) + ',' + Math.round(gamma(g)*255) + ',' + Math.round(gamma(bl)*255) + ')';
  }

  // Heat ramp: active = red (most open) -> green (least); completed = green (most) -> gold (least)
  function colorFor(type, i, n){
    var t = n<=1 ? 0 : i/(n-1);
    var h = type==='active' ? lerp(28,150,t) : lerp(150,96,t);
    return oklchToRgb(0.63, 0.175, h);
  }

  function buildScreen(host, opts){
    var items = sortDesc(opts.items), n = items.length, max = 0, i;
    for (i=0;i<n;i++) if (items[i].value > max) max = items[i].value;
    var axisMax = niceAxisMax(max), ticks = axisTicks(axisMax);

    host.innerHTML = '';
    var header = el('div','header'), title = el('h1','title'), sub = el('div','subtitle');
    title.textContent = opts.title; sub.textContent = opts.subtitle;
    header.appendChild(title); header.appendChild(sub); host.appendChild(header);

    var plot = el('div','plot'), rows = el('div','rows'), axis = el('div','axis');
    plot.appendChild(rows); plot.appendChild(axis); host.appendChild(plot);
    var upd = el('div','last-updated'); upd.textContent = 'Last updated: ' + opts.asOf; host.appendChild(upd);

    // shrink type for very dense lists
    var nameFs='1.95vw',nameLh='2.1vw',nameMt='-1.05vw',valFs='2.45vw',valLh='2.65vw',valMt='-1.32vw',barH='3.35vh',barMt='-1.675vh';
    if (n > 16) { nameFs='1.78vw';nameLh='1.95vw';nameMt='-0.98vw';valFs='2.25vw';valLh='2.45vw';valMt='-1.22vw';barH='2.9vh';barMt='-1.45vh'; }

    var bars=[], vals=[], targets=[], values=[];
    for (i=0;i<n;i++){
      var it = items[i], pct = (it.value/axisMax)*100;
      var row = el('div','row'), name = el('div','name'), area = el('div','bar-area'), bar = el('div','bar'), val = el('div','value');
      name.textContent = it.name;
      name.style.fontSize=nameFs; name.style.lineHeight=nameLh; name.style.marginTop=nameMt;
      area.style.height=barH; area.style.marginTop=barMt;
      bar.style.backgroundColor = colorFor(opts.type, i, n);
      val.textContent='0'; val.style.fontSize=valFs; val.style.lineHeight=valLh; val.style.marginTop=valMt;
      area.appendChild(bar); area.appendChild(val);
      row.appendChild(name); row.appendChild(area); rows.appendChild(row);
      bars.push(bar); vals.push(val); targets.push(pct); values.push(it.value);
    }
    for (i=0;i<ticks.length;i++){
      var tick = el('div','tick'), mark = el('div','tick-mark'), lab = el('div','tick-label');
      lab.textContent = ticks[i]; tick.appendChild(mark); tick.appendChild(lab); axis.appendChild(tick);
    }

    var maxT = Math.max.apply(null, targets.concat([1]));
    var durs = targets.map(function(t){ return BUILD * (0.35 + 0.65 * (t / maxT)); }); // bigger bars build longer
    return { host:host, bars:bars, vals:vals, targets:targets, values:values, durs:durs };
  }

  var fill = document.getElementById('pfill');
  var scr = null;

  // Build (or rebuild) both screens from a data object, reset to hidden start state.
  function build(data){
    scr = [
      buildScreen(document.getElementById('screen0'), { title:'Active Work Orders',    subtitle:'As of ' + data.asOf,             asOf:data.asOf, items:data.active || [],       type:'active'    }),
      buildScreen(document.getElementById('screen1'), { title:'Completed Work Orders', subtitle:'MTD \u2022 As of ' + data.asOf,    asOf:data.asOf, items:data.completedMTD || [], type:'completed' })
    ];
    // clean hidden starting state (prevents any flash on load)
    scr[0].host.style.zIndex = '2'; scr[1].host.style.zIndex = '1';
    for (var s=0;s<2;s++){
      scr[s].host.style.opacity = '0';
      for (var i=0;i<scr[s].bars.length;i++){
        scr[s].bars[i].style.width = '0%';
        scr[s].vals[i].style.left = '0%'; scr[s].vals[i].style.opacity = '0'; scr[s].vals[i].style.transform = 'scale(0.7)';
      }
    }
  }

  // bubbly springs
  function back(p){ var c1=0.5, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); }
  function pop(p){  var c1=1.9, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); }

  function setRow(sc, i, p){
    var epBar = back(p);             // bar overshoots then settles
    var epNum = Math.min(1, epBar);  // displayed value never exceeds the target
    var w = epBar * sc.targets[i];
    sc.bars[i].style.width = w + '%';
    var v = sc.vals[i];
    v.style.left = w + '%';          // number rides the tip and bounces with the bar
    v.textContent = String(Math.round(epNum * sc.values[i]));
    v.style.opacity = String(p <= 0 ? 0 : Math.min(1, p / 0.16));
    var ps = p <= 0 ? 0 : pop(Math.min(1, p / 0.3));
    v.style.transform = 'scale(' + (0.62 + 0.38 * ps) + ')';
  }

  var start = null;
  function frame(now){
    if (start === null) start = now;
    var e = now - start;
    if (e > TOTAL) e = TOTAL;

    fill.style.width = (Math.min(1, e / TOTAL) * 100) + '%';

    // slide 0 fades in, holds, then fades out to reveal slide 1
    var o0 = 1;
    if (e < 300) o0 = e / 300;
    else if (e >= SLIDE) o0 = 0;
    else if (e > SLIDE - FADE) o0 = 1 - (e - (SLIDE - FADE)) / FADE;
    scr[0].host.style.opacity = String(o0);
    scr[1].host.style.opacity = (e < SLIDE - FADE) ? '0' : '1';

    for (var s=0;s<2;s++){
      var sc = scr[s], base = s * SLIDE;
      for (var i=0;i<sc.bars.length;i++){
        var p = (e - base) / sc.durs[i];
        if (p < 0) p = 0; if (p > 1) p = 1;
        setRow(sc, i, p);
      }
    }

    if (e >= TOTAL){
      // settle the final frame, then re-fetch fresh JSON and replay (keeps signage live)
      for (var s2=0;s2<2;s2++){ var sc2 = scr[s2]; for (var k=0;k<sc2.bars.length;k++) setRow(sc2, k, 1); }
      scr[0].host.style.opacity = '0'; scr[1].host.style.opacity = '1';
      startCycle();
      return;
    }
    requestAnimationFrame(frame);
  }

  // ---------- Live data: load from Google Sheets, loop forever, refresh every cycle ----------
  var current = FALLBACK, nextData = null;
  var dataRequestId = 0;

  function isDataShapeValid(d){
    if (!d || typeof d.asOf !== 'string') return false;
    if (Object.prototype.toString.call(d.active) !== '[object Array]') return false;
    if (Object.prototype.toString.call(d.completedMTD) !== '[object Array]') return false;
    var groups = [d.active, d.completedMTD];
    for (var g=0;g<groups.length;g++){
      for (var i=0;i<groups[g].length;i++){
        var item = groups[g][i];
        if (!item || typeof item.name !== 'string' || !item.name) return false;
        if (typeof item.value !== 'number' || !isFinite(item.value) || item.value < 0) return false;
      }
    }
    return true;
  }

  function fetchData(){
    return new Promise(function(resolve){
      var callbackName = '__wokpisData' + Date.now() + '_' + (++dataRequestId);
      var script = document.createElement('script');
      var done = false, timer;

      function finish(d){
        if (done) return;
        done = true;
        if (timer) clearTimeout(timer);
        script.onerror = null;
        if (script.parentNode) script.parentNode.removeChild(script);
        try { delete window[callbackName]; }
        catch (ignore) { window[callbackName] = undefined; }
        resolve(isDataShapeValid(d) ? d : null);
      }

      window[callbackName] = finish;
      script.async = true;
      script.onerror = function(){ finish(null); };
      script.src = DATA_URL +
        (DATA_URL.indexOf('?') < 0 ? '?' : '&') +
        'callback=' + encodeURIComponent(callbackName) +
        '&t=' + Date.now();
      timer = setTimeout(function(){ finish(null); }, 10000);
      document.getElementsByTagName('head')[0].appendChild(script);
    });
  }

  function startCycle(){
    if (nextData) { current = nextData; nextData = null; }
    build(current);
    start = null;
    fetchData().then(function(d){ if (d) nextData = d; });  // prefetch for the next loop
    requestAnimationFrame(frame);
  }

  // first paint: show live data if it arrives quickly, otherwise fall back
  // immediately so the board never sits blank on a cold boot. Either way it
  // keeps refreshing from Google Sheets on every loop after that.
  var painted = false;
  function firstPaint(d){ if (painted) return; painted = true; if (d) current = d; startCycle(); }
  fetchData().then(firstPaint);
  setTimeout(function(){ firstPaint(null); }, 2500);
})();
</script>
</body>
</html>
